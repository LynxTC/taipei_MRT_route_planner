<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>台北捷運最佳轉乘路徑規劃器</title>
<style>
  :root {
    --bg: #f4f5f7; --card: rgba(255,255,255,0.88); --ink: #1d2330; --muted: #6b7280;
    --line: #e2e5ea; --accent: #0b6bcb; --shadow: 0 10px 30px rgba(20,30,50,.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.dragging { cursor: grabbing; }
  #map.hover { cursor: pointer; }
  .card { position: absolute; top: 16px; left: 16px; width: 340px; max-height: calc(100% - 32px);
    display: flex; flex-direction: column; background: var(--card); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.7); border-radius: 16px;
    box-shadow: var(--shadow); padding: 16px; z-index: 2; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .head h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .5px; }
  .head h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #f0f3f7; }
  .field { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 3px solid; background: #fff; }
  .dot.start { border-color: #16a34a; } .dot.end { border-color: #dc2626; }
  .field label { font-size: 12px; color: var(--muted); width: 28px; flex: none; }
  .field input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; outline: none; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,107,203,.15); }
  .field input:disabled { background: #eef0f3; color: #9aa1ab; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 2px; min-height: 16px; }
  #result { overflow-y: auto; margin-top: 6px; }
  .total { display: flex; align-items: baseline; gap: 8px; padding: 12px 0 8px; border-top: 1px solid var(--line); }
  .total .num { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
  .total .unit { font-size: 14px; color: var(--muted); }
  .total .sub { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.5; }
  .steps { list-style: none; padding: 0; margin: 4px 0 0; }
  .step { position: relative; padding: 6px 0 10px 26px; font-size: 13.5px; line-height: 1.55; }
  .step::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: -4px; width: 4px; border-radius: 2px; background: var(--c, #ccc); }
  .step.walk::before { background: repeating-linear-gradient(to bottom, #9aa1ab 0 4px, transparent 4px 8px); width: 2px; left: 9px; }
  .step:last-child::before { display: none; }
  .step .ic { position: absolute; left: 3px; top: 8px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--c, #9aa1ab); }
  .step.walk .ic { border-width: 2px; width: 12px; height: 12px; left: 4px; top: 9px; }
  .step b { font-weight: 700; }
  .pill { display: inline-block; color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; margin: 0 2px; vertical-align: 1px; }
  .meta { color: var(--muted); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .zoom { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  .zoom button { width: 38px; height: 38px; padding: 0; font-size: 18px; background: var(--card); box-shadow: var(--shadow); }
  .src { position: absolute; right: 64px; bottom: 18px; font-size: 11px; color: var(--muted); z-index: 1; }
  @media (max-width: 720px) {
    .card { left: 8px; right: 8px; top: 8px; width: auto; max-height: 52%; padding: 12px; }
    .total .num { font-size: 26px; }
    .legend { display: none; }
    .src { display: none; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div class="card" id="card">
  <div class="head">
    <h1>台北捷運 最佳轉乘路徑<small>點選地圖站點或輸入站名</small></h1>
    <button id="resetBtn" type="button">重設</button>
  </div>
  <div class="field">
    <span class="dot start"></span><label for="startInput">起點</label>
    <input id="startInput" list="startList" placeholder="輸入或點選起站" autocomplete="off">
  </div>
  <div class="field">
    <span class="dot end"></span><label for="endInput">終點</label>
    <input id="endInput" list="endList" placeholder="請先選擇起站" autocomplete="off" disabled>
  </div>
  <datalist id="startList"></datalist>
  <datalist id="endList"></datalist>
  <div class="hint" id="hint"></div>
  <div id="result"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="zoom">
  <button type="button" id="zoomIn" aria-label="放大">＋</button>
  <button type="button" id="zoomOut" aria-label="縮小">－</button>
  <button type="button" id="zoomFit" aria-label="全圖" style="font-size:13px">全圖</button>
</div>

 * =================================================================== */
class MinHeap {
  constructor() { this.a = []; }
  push(x) { const a = this.a; a.push(x); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } }
  pop() { const a = this.a, top = a[0], last = a.pop();
    if (a.length) { a[0] = last; let i = 0;

        if (r < a.length && a[r][0] < a[m][0]) m = r;

    if (!u.includes('|') && u !== src) continue;     // 實體節點不得中繼
    for (const e of adj[u] || []) {

      const nd = d + e.weight + (e.type === 'transfer' || e.type === 'outside' ? 0.01 : 0);
      if (nd < (dist[e.target] ?? Infinity)) { dist[e.target] = nd; prev[e.target] = u; prevEdge[e.target] = e; h.push([nd, e.target]); }

  const nodes = [], edges = [];
  for (let v = dst; v !== undefined; v = prev[v]) { nodes.unshift(v); if (prevEdge[v]) edges.unshift(prevEdge[v]); }

}

/* ---- 方向判斷：在 serviceRoutes 中找出包含此段連續站序的路線 ---- */
function directionOf(line, seq) {
  const g = groupOf(line), heads = new Set();
  for (const r of serviceRoutes) {
    if (groupOf(r.line) !== g) continue;
    const st = r.stations, i0 = st.indexOf(seq[0]);
    if (i0 < 0) continue;
    for (const dir of [1, -1]) {
      let ok = true;
      for (let k = 1; k < seq.length; k++) if (st[i0 + dir * k] !== seq[k]) { ok = false; break; }
      if (ok) heads.add(dir === 1 ? st[st.length - 1] : st[0]);
    }
  }
  return [...heads].join(' / ');
}

function buildItinerary(res) {
  const steps = [];

  for (const e of res.edges) {
    if (e.type === 'virtual') continue;
    const [sa, la] = e.source.split('|'), [sb] = e.target.split('|');
    if (e.type === 'ride') {
      if (ride && ride.line === la) { ride.stations.push(sb); ride.sec += e.weight; }
      else { ride = { kind: 'ride', line: la, stations: [sa, sb], sec: e.weight }; steps.push(ride); }
    } else {
      ride = null;
      steps.push({ kind: 'walk', from: sa, to: sb, toLine: e.target.split('|')[1], sec: e.weight, outside: e.type === 'outside' });
    }
  }
  steps.forEach(s => { if (s.kind === 'ride') s.dir = directionOf(s.line, s.stations); });

  if (targetStations && targetStations.length) {
    b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    for (const s of targetStations) { const p = stationData[s]; b.x0 = Math.min(b.x0, p.x); b.y0 = Math.min(b.y0, p.y); b.x1 = Math.max(b.x1, p.x); b.y1 = Math.max(b.y1, p.y); }
  }
  const bw = Math.max(b.x1 - b.x0, 4) + 3, bh = Math.max(b.y1 - b.y0, 4) + 2;     // 加上站名留白
  const aw = Math.max(W - padL - padR, 120), ah = Math.max(H - padT - padB, 120);
  view.scale = Math.min(aw / bw, ah / bh);
  if (targetStations) view.scale = Math.min(view.scale, 70);
  const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  view.ox = padL + aw / 2 - cx * view.scale;
  view.oy = padT + ah / 2 - cy * view.scale;
  requestDraw();
}
const toScreen = (x, y) => [x * view.scale + view.ox, y * view.scale + view.oy];
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  requestDraw();
}
function zoomAt(f, sx, sy) {
  const ns = Math.max(6, Math.min(160, view.scale * f));
  f = ns / view.scale;
  view.ox = sx - (sx - view.ox) * f; view.oy = sy - (sy - view.oy) * f; view.scale = ns;
  requestDraw();
}

/* ---- 指標事件（拖曳 / 點擊 / 雙指縮放），以 hasDragged 防止拖曳誤觸 ---- */
const pointers = new Map();
let hasDragged = false, downPos = null, pinchDist = 0;
canvas.addEventListener('pointerdown', ev => {
  canvas.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pointers.size === 1) { hasDragged = false; downPos = { x: ev.clientX, y: ev.clientY }; }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); hasDragged = true; }
});
canvas.addEventListener('pointermove', ev => {
  const p = pointers.get(ev.pointerId);
  if (!p) { canvas.classList.toggle('hover', !!hitTest(ev.clientX, ev.clientY)); return; }
  if (pointers.size === 1) {
    if (!hasDragged && Math.hypot(ev.clientX - downPos.x, ev.clientY - downPos.y) > 5) { hasDragged = true; canvas.classList.add('dragging'); }
    if (hasDragged) { view.ox += ev.clientX - p.x; view.oy += ev.clientY - p.y; requestDraw(); }
  } else if (pointers.size === 2) {
    const other = [...pointers.entries()].find(([id]) => id !== ev.pointerId)[1];
    const nd = Math.hypot(ev.clientX - other.x, ev.clientY - other.y);
    if (pinchDist > 0) zoomAt(nd / pinchDist, (ev.clientX + other.x) / 2, (ev.clientY + other.y) / 2);
    pinchDist = nd;
  }
  p.x = ev.clientX; p.y = ev.clientY;
});
function endPointer(ev) {
  if (!pointers.has(ev.pointerId)) return;
  pointers.delete(ev.pointerId);
  if (pointers.size === 0) {
    canvas.classList.remove('dragging');
    if (!hasDragged && ev.type === 'pointerup') { const s = hitTest(ev.clientX, ev.clientY); if (s) onStationClick(s); }
  }
  pinchDist = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(Math.exp(-ev.deltaY * 0.0015), ev.clientX, ev.clientY); }, { passive: false });
document.getElementById('zoomIn').onclick = () => zoomAt(1.3, W / 2, H / 2);
document.getElementById('zoomOut').onclick = () => zoomAt(1 / 1.3, W / 2, H / 2);
document.getElementById('zoomFit').onclick = () => fitView();

function stationRadius(s) { const k = view.scale; return isInterchange(s) ? Math.max(4.5, k * 0.24) : Math.max(3, k * 0.15); }
function hitTest(sx, sy) {
  let best = null, bd = Infinity;
  for (const s of STATIONS) {
    const [x, y] = toScreen(stationData[s].x, stationData[s].y);
    const d = Math.hypot(x - sx, y - sy), r = Math.max(12, stationRadius(s) + 6);
    if (d < r && d < bd) { bd = d; best = s; }
  }
  return best;
}

/* ===================================================================
 * 5. 狀態機
 *    0 = 初始；1 = 已選起站；2 = 已選起訖、顯示結果
 * =================================================================== */
const app = { state: 0, start: null, end: null, result: null, steps: null, pathStations: new Set(), pathSegs: new Set(), keyStations: new Set() };

function setStart(s, { fromInput = false } = {}) {
  app.state = 1; app.start = s; app.end = null; app.result = null; app.steps = null;
  app.pathStations = new Set(); app.pathSegs = new Set(); app.keyStations = new Set([s]);
  if (!fromInput) startInput.value = s;
  endInput.disabled = false; endInput.value = ''; endInput.placeholder = '輸入或點選終站';
  fillList(endList, s);
  hint.textContent = '已選擇起站「' + s + '」，請點選地圖或輸入終點站。';
  renderResult();
  if (!fromInput && window.innerWidth > 720) endInput.focus({ preventScroll: true });
  requestDraw();
}
function setEnd(s, { fromInput = false } = {}) {
  if (!app.start || s === app.start) return;
  const res = dijkstra(app.start, s);
  if (!res) return;
  app.state = 2; app.end = s; app.result = res;
  if (!fromInput) endInput.value = s;
  app.steps = buildItinerary(res);
  app.pathStations = new Set(); app.pathSegs = new Set();
  for (const st of app.steps) {
    if (st.kind === 'ride') {
      st.stations.forEach(x => app.pathStations.add(x));
      for (let i = 0; i < st.stations.length - 1; i++) app.pathSegs.add([st.stations[i], st.stations[i + 1]].sort().join('|') + '|' + groupOf(st.line));
    } else { app.pathStations.add(st.from); app.pathStations.add(st.to); }
  }
  app.pathStations.add(app.start); app.pathStations.add(s);
  app.keyStations = new Set([app.start, s]);
  app.steps.forEach(st => { if (st.kind === 'walk') { app.keyStations.add(st.from); app.keyStations.add(st.to); } });
  hint.textContent = '點選地圖其他站點可直接設為新起站。';
  renderResult();
  if (W <= 720) fitView([...app.pathStations]);       // 手機：自動對焦路徑
  requestDraw();
}
function resetAll() {
  app.state = 0; app.start = app.end = app.result = app.steps = null;
  app.pathStations = new Set(); app.pathSegs = new Set(); app.keyStations = new Set();
  startInput.value = ''; endInput.value = ''; endInput.disabled = true; endInput.placeholder = '請先選擇起站';
  fillList(endList, null);
  hint.textContent = '';
  renderResult();
  fitView();
}
function onStationClick(s) {
  if (app.state === 0) setStart(s);
  else if (app.state === 1) { if (s !== app.start) setEnd(s); }
  else setStart(s);                                     // 狀態 2：點其他站 → 全新起站
}

/* ---- 輸入框 ---- */
const startInput = document.getElementById('startInput'), endInput = document.getElementById('endInput');
const startList = document.getElementById('startList'), endList = document.getElementById('endList');
const hint = document.getElementById('hint'), resultEl = document.getElementById('result');
const SORTED = [...STATIONS].sort((a, b) => a.localeCompare(b, 'zh-Hant-TW'));
function fillList(el, exclude) {
  el.innerHTML = '';
  for (const s of SORTED) if (s !== exclude) { const o = document.createElement('option'); o.value = s; el.appendChild(o); }
}
const ALIAS = { '台北101': '台北101/世貿', '世貿': '台北101/世貿', '101': '台北101/世貿', '廣慈': '廣慈/奉天宮', '奉天宮': '廣慈/奉天宮',
  '北車': '台北車站', '台北': '台北車站', '台北車': '台北車站', '小巨蛋': '台北小巨蛋', '動物園站': '動物園' };
function resolveName(v) {
  v = (v || '').trim().replace(/臺/g, '台').replace(/^捷運/, '');
  if (!v) return null;
  if (stationData[v]) return v;
  if (ALIAS[v]) return ALIAS[v];
  const t = v.replace(/站$/, '');
  if (stationData[t]) return t;
  if (ALIAS[t]) return ALIAS[t];
  return null;
}
function onStartInput(commit) {
  const s = resolveName(startInput.value);
  if (s) { if (s !== app.start) setStart(s, { fromInput: true }); if (commit) startInput.value = s; }
  else if (!startInput.value.trim() && app.state !== 0) resetAll();
}
function onEndInput(commit) {
  const s = resolveName(endInput.value);
  if (s && s !== app.start) { if (s !== app.end) setEnd(s, { fromInput: true }); if (commit) endInput.value = s; }
  else if (commit && endInput.value && s === app.start) { hint.textContent = '終點不可與起點相同。'; }
}
startInput.addEventListener('input', () => onStartInput(false));
startInput.addEventListener('change', () => onStartInput(true));
startInput.addEventListener('keydown', e => { if (e.key === 'Enter') onStartInput(true); });
endInput.addEventListener('input', () => onEndInput(false));
endInput.addEventListener('change', () => onEndInput(true));
endInput.addEventListener('keydown', e => { if (e.key === 'Enter') onEndInput(true); });
document.getElementById('resetBtn').onclick = resetAll;

/* ---- 結果面板 ---- */
const halfMin = sec => Math.max(0.5, Math.round(sec / 30) / 2);          // 以半分鐘為單位
const fmtMin = sec => String(halfMin(sec));
const pill = l => `<span class="pill" style="background:${LINE_INFO[l].color};${l === 'Y' || l === 'GX' ? 'color:#3a3200' : ''}">${LINE_INFO[l].name}</span>`;
function renderResult() {
  if (app.state !== 2 || !app.steps) { resultEl.innerHTML = ''; return; }
  const rideSec = app.steps.filter(s => s.kind === 'ride').reduce((a, s) => a + s.sec, 0);
  const walkSec = app.steps.filter(s => s.kind === 'walk').reduce((a, s) => a + s.sec, 0);
  const nTransfer = app.steps.filter(s => s.kind === 'walk').length;
  let html = `<div class="total"><span class="num">${fmtMin(app.result.seconds)}</span><span class="unit">分鐘</span>
    <span class="sub">乘車 ${walkSec ? halfMin(app.result.seconds) - halfMin(walkSec) : fmtMin(app.result.seconds)} 分${walkSec ? ` ＋ 轉乘步行 ${fmtMin(walkSec)} 分` : ''}<br>${nTransfer ? `轉乘 ${nTransfer} 次` : '免轉乘直達'} · 共 ${app.steps.filter(s => s.kind === 'ride').reduce((a, s) => a + s.stations.length - 1, 0)} 站</span></div><ol class="steps">`;
  app.steps.forEach((st, i) => {
    if (st.kind === 'ride') {
      const c = LINE_INFO[st.line].color;
      const verb = i === 0 ? '於' : '轉乘';
      html += `<li class="step" style="--c:${c}"><span class="ic"></span>${verb} <b>${st.stations[0]}</b> 搭乘 ${pill(st.line)}<br>往 <b>${st.dir}</b> 方向，搭 ${st.stations.length - 1} 站至 <b>${st.stations[st.stations.length - 1]}</b> <span class="meta">（約 ${fmtMin(st.sec)} 分）</span></li>`;
    } else {
      const m = fmtMin(st.sec);
      html += st.outside
        ? (st.from === st.to
          ? `<li class="step walk"><span class="ic"></span>在 <b>${st.from}</b> 出站，站外轉乘${LINE_INFO[st.toLine].name} <span class="meta">（步行約 ${m} 分）</span></li>`
          : `<li class="step walk"><span class="ic"></span><b>${st.from}</b> 出站，步行至 <b>${st.to}</b> 站外轉乘 <span class="meta">（步行約 ${m} 分）</span></li>`)
        : `<li class="step walk"><span class="ic"></span>在 <b>${st.from}</b> 站內轉乘${st.from === '大橋頭' ? '（支線換車）' : ''} <span class="meta">（步行約 ${m} 分）</span></li>`;
    }
  });
  html += `<li class="step" style="--c:#dc2626"><span class="ic"></span>抵達 <b>${app.end}</b></li></ol>`;
  resultEl.innerHTML = html;
}
function renderLegend() {
  const el = document.getElementById('legend'); const seen = new Set(); let h = '';
  for (const l of ['BR', 'R', 'G', 'O', 'BL', 'Y', 'RN', 'GX']) {
    const key = l === 'O' ? 'OL' : l; if (seen.has(key)) continue; seen.add(key);
    h += `<span><i style="background:${LINE_INFO[key].color}"></i>${LINE_INFO[key].name}</span>`;
  }
  h += `<span><i style="background:repeating-linear-gradient(90deg,#888 0 3px,transparent 3px 6px)"></i>站外轉乘</span>`;
  el.innerHTML = h;
}

/* ===================================================================
 * 6. 繪圖
 * =================================================================== */
let drawQueued = false;
function requestDraw() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(draw); } }
function tracePts(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => { const [sx, sy] = toScreen(x, y); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); }); }

function draw(t) {
  drawQueued = false;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#f4f5f7'; ctx.fillRect(0, 0, W, H);
  const k = view.scale, active = app.state === 2;
  const lw = Math.max(2.5, k * 0.15);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // 站外轉乘：膠囊背景 + 虛線
  for (const [a, b] of OUTSIDE_PAIRS) {
    if (a === b) {                                     // 同站名站外轉乘（如板橋）：虛線圓環
      if (OUTSIDE_PAIRS.findIndex(p => p[0] === a && p[1] === a) !== OUTSIDE_PAIRS.findIndex(p => p[0] === a)) continue;
      const [x, y] = toScreen(stationData[a].x, stationData[a].y);
      const on = !active || app.keyStations.has(a) && app.pathStations.has(a);
      const R = Math.max(10, k * 0.45);
      ctx.globalAlpha = on ? 1 : 0.15;
      ctx.fillStyle = 'rgba(120,130,150,.18)'; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = Math.max(1.5, k * 0.06); ctx.strokeStyle = active && on ? '#333' : '#8a93a3';
      ctx.setLineDash([Math.max(3, k * 0.12), Math.max(3, k * 0.12)]);
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      continue;
    }
    if (a > b) continue;
    const pa = toScreen(stationData[a].x, stationData[a].y), pb = toScreen(stationData[b].x, stationData[b].y);
    const on = !active || app.keyStations.has(a) && app.keyStations.has(b) && app.pathStations.has(a);
    ctx.globalAlpha = on ? 1 : 0.15;
    ctx.lineWidth = Math.max(16, k * 0.75); ctx.strokeStyle = 'rgba(120,130,150,.18)';
    ctx.beginPath(); ctx.moveTo(...pa); ctx.lineTo(...pb); ctx.stroke();
    ctx.lineWidth = Math.max(1.5, k * 0.06); ctx.strokeStyle = active && on ? '#333' : '#8a93a3';
    ctx.setLineDash([Math.max(3, k * 0.12), Math.max(3, k * 0.12)]);
    ctx.beginPath(); ctx.moveTo(...pa); ctx.lineTo(...pb); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 路線
  for (const pass of active ? [0, 1] : [0]) {
    for (const seg of drawSegments) {
      const key = [seg.a, seg.b].sort().join('|') + '|' + seg.group;
      const onPath = app.pathSegs.has(key);
      if (active && (pass === 0) === onPath) continue;
      ctx.globalAlpha = active && !onPath ? 0.13 : 1;
      if (onPath) { ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = lw * 2 + 4; tracePts(seg.pts); ctx.stroke(); }
      ctx.strokeStyle = LINE_INFO[seg.line].color;
      ctx.lineWidth = onPath ? lw * 2 : lw;
      tracePts(seg.pts); ctx.stroke();
    }
  }

  // 站點
  for (const s of STATIONS) {
    const p = stationData[s], [x, y] = toScreen(p.x, p.y);
    const on = !active || app.pathStations.has(s);
    const inter = isInterchange(s);
    let r = stationRadius(s);
    if (active && on) r *= inter || app.keyStations.has(s) ? 1.35 : 1.15;
    ctx.globalAlpha = on ? 1 : 0.18;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = inter ? Math.max(1.8, k * 0.07) : Math.max(1.5, k * 0.06);
    ctx.strokeStyle = inter ? '#2b2f36' : LINE_INFO[stationLines[s][0]].color;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 起訖標記 + 脈衝
  const now = performance.now();
  let animate = false;
  const mark = (s, color, pulse) => {
    if (!s) return;
    const [x, y] = toScreen(stationData[s].x, stationData[s].y);
    const r = stationRadius(s) * 1.4 + 2;
    if (pulse) {
      animate = true;
      for (const off of [0, 0.5]) {
        const ph = ((now / 1400) + off) % 1;
        ctx.globalAlpha = (1 - ph) * 0.55; ctx.strokeStyle = color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, r + ph * Math.max(18, k * 0.9), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  };
  mark(app.start, '#16a34a', app.state >= 1);
  mark(app.end, '#dc2626', app.state === 2);

  // 站名
  const fs = Math.max(11, Math.min(18, k * 0.42));
  for (const s of STATIONS) {
    const isKey = app.keyStations.has(s);
    if (active && !isKey) continue;                     // 標籤減量
    const p = stationData[s], [x, y] = toScreen(p.x, p.y);
    const r = stationRadius(s) + (isKey ? 6 : 3);
    const dx = p.align === 'left' ? r : p.align === 'right' ? -r : 0;
    const dy = p.baseline === 'bottom' ? -r : p.baseline === 'top' ? r : 0;
    const f = isKey ? fs * 1.25 : fs;
    ctx.font = `${isKey || isInterchange(s) ? 700 : 500} ${f}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
    ctx.textAlign = p.align; ctx.textBaseline = p.baseline;
    ctx.lineWidth = isKey ? 5 : 3.5; ctx.strokeStyle = 'rgba(244,245,247,.95)';
    ctx.strokeText(s, x + dx, y + dy);
    ctx.fillStyle = s === app.start ? '#15803d' : s === app.end ? '#b91c1c' : '#1d2330';
    ctx.fillText(s, x + dx, y + dy);
  }
  if (animate) requestDraw();
}

/* ===================================================================
 * 7. 啟動
 * =================================================================== */
fillList(startList, null); fillList(endList, null); renderLegend();
window.addEventListener('resize', () => { resize(); fitView(); });
resize(); fitView();
</script>
</body>
</html>
